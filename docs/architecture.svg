  <title
     id="title">ROS2-GP-API system architecture</title>
  <desc
     id="desc">ROS clients send services and actions to two ROS 2 nodes that communicate through HTTP with the GP app on an iPad. The iPad connects over the local network to a Proceq GPR probe; status and exported ZIP data are returned to the ROS environment.</desc>
