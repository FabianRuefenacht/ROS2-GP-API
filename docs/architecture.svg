<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
  <title id="title">ROS2-GP-API system architecture</title>
  <desc id="desc">ROS clients send services and actions to two ROS 2 nodes that communicate through HTTP with the GP app on an iPad. The iPad connects over the local network to a Proceq GPR probe; status and exported ZIP data are returned to the ROS environment.</desc>
  <defs>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#25354a}
      .title{font-size:26px;font-weight:700;letter-spacing:-.6px}
      .sub{font-size:13px;fill:#64748b}
      .h{font-size:18px;font-weight:700}
      .body{font-size:14px;fill:#475569}
      .tiny{font-size:12px;fill:#64748b}
      .panel{fill:#fff;stroke:#d4deea;stroke-width:1.6}
      .node{fill:#f2f7fc;stroke:#9eb7d4;stroke-width:1.6}
      .device{fill:#f7fafc;stroke:#b7c5d5;stroke-width:1.6}
      .arrow{stroke:#54718f;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .green{stroke:#38947e}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#54718f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowgreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#38947e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1120" height="530" rx="20" fill="#f8fafc"/>
  <text class="title" x="34" y="48">System architecture</text>
  <text class="sub" x="34" y="75">ROS 2 Humble · HTTP API hosted on the iPad · configurable network addresses</text>

  <!-- ROS 2 host -->
  <rect class="panel" x="30" y="111" width="584" height="334" rx="16"/>
  <text class="h" x="52" y="143">ROS 2 host</text><text class="tiny" x="52" y="162">Jetson / robot · gpr_ros2 + gpr_interfaces</text>
  <rect class="node" x="51" y="184" width="174" height="97" rx="11"/>
  <text class="h" x="67" y="212">ROS 2 client</text>
  <text class="body" x="67" y="236">Services / action</text>
  <text class="tiny" x="67" y="258">scripts/example.py</text>
  <rect class="node" x="279" y="181" width="306" height="95" rx="11"/>
  <text class="h" x="296" y="211">gpr_api_node</text>
  <text class="body" x="296" y="234">Control · status · timestamps</text>
  <text class="tiny" x="296" y="254">GprApiClient (httpx)</text>
  <rect class="node" x="279" y="307" width="306" height="95" rx="11"/>
  <text class="h" x="296" y="336">gpr_export_node</text>
  <text class="body" x="296" y="359">ZIP download · validation</text>
  <text class="tiny" x="296" y="379">SEG-Y / JSON / CSV</text>
  <path class="arrow" d="M225 218 H279" marker-end="url(#arrow)"/>
  <path class="arrow" d="M225 254 H245 V353 H279" marker-end="url(#arrow)"/>
  <text class="tiny" x="52" y="420">Both nodes read gpr_params_live.yaml</text>

  <!-- iPad -->
  <rect class="device" x="688" y="168" width="184" height="175" rx="18"/>
  <rect x="704" y="184" width="152" height="126" rx="9" fill="#e8f0f8"/>
  <text class="h" x="726" y="222">iPad</text>
  <text class="body" x="719" y="250">GP application</text>
  <text class="tiny" x="721" y="273">REST API · :9000</text>
  <circle cx="780" cy="328" r="5" fill="#bac9d7"/>
  <path class="arrow" d="M585 225 H688" marker-end="url(#arrow)"/>
  <text class="tiny" x="619" y="207">HTTP</text>
  <path class="arrow green" d="M688 356 H637 V365 H585" marker-end="url(#arrowgreen)"/>
  <text class="tiny" x="618" y="384">ZIP</text>

  <!-- Probe -->
  <rect class="device" x="927" y="205" width="164" height="106" rx="15"/>
  <text class="h" x="951" y="237">GPR probe</text>
  <text class="body" x="946" y="261">GP8000 tested</text>
  <text class="tiny" x="942" y="284">GP8100/8800 untested</text>
  <path class="arrow" d="M872 254 H927" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="tiny" x="882" y="236">LAN</text>

  <text class="sub" x="36" y="482">Control: ROS 2 → HTTP → GP app → GPR probe</text>
  <text class="sub" x="36" y="502">Data: GP app → streamed ZIP → ROS host · timestamps kept for later analysis</text>
</svg>
